plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"

# This project uses double-quoted strings, matching the Rails generators.
Style/StringLiterals:
  EnforcedStyle: double_quotes

# Public API documentation lives in docs/, not in class comments.
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
