plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"

# This project uses double-quoted strings, matching the Rails generators.
Style/StringLiterals:
  EnforcedStyle: double_quotes

# Public API documentation lives in docs/, not in class comments.
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# Specs read better when one example checks a whole behaviour (e.g. status + body).
RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 10
  CountAsOne: ["array", "hash", "heredoc", "method_call"]

# Migrations describe tables, not logic: size metrics don't apply to them.
Metrics:
  Exclude:
    - "db/migrate/**/*"
