# Connection settings come from environment variables (see .env.example).
# In production, Render provides DATABASE_URL, which takes precedence over these keys.
default: &default
  adapter: postgresql
  encoding: unicode
  # Requests hold a connection only while they query, and live streams hold none. Solid Queue (inside
  # Puma) and the events listener need a few of their own.
  max_connections: <%= ENV.fetch("DB_POOL", 10) %>
  host: <%= ENV.fetch("DATABASE_HOST", nil) %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", nil) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>

development:
  <<: *default
  database: jukebox_hub_development

test:
  <<: *default
  database: jukebox_hub_test

production:
  <<: *default
