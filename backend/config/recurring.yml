# Recurring jobs, run by the Solid Queue scheduler (inside Puma). See ADR 0002 and ADR 0004.
default: &default
  expire_parties:
    class: ExpirePartiesJob
    schedule: every 10 minutes
  delete_ended_parties:
    class: DeleteEndedPartiesJob
    schedule: every hour

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
