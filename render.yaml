# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jukebox-hub-api
    runtime: ruby
    rootDir: backend
    buildCommand: bundle install && bin/rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jukebox-hub-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RAILS_MAX_THREADS
        value: "5"

  - type: web
    name: jukebox-hub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jukebox-hub-db
    plan: free
